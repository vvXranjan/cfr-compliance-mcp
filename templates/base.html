<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CFR Compliance Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <nav class="nav" aria-label="Primary">
      <a class="brand" href="/dashboard">
        <span class="brand-mark" aria-hidden="true">CF</span>
        <span>CFR Compliance</span>
      </a>
      <div class="nav-links">
        <a href="/dashboard" class="{{ 'active' if active == 'overview' else '' }}">Overview</a>
        <a href="/dashboard/analyses" class="{{ 'active' if active == 'analyses' else '' }}">Analyses</a>
        <a href="/dashboard/reviews" class="{{ 'active' if active == 'reviews' else '' }}">Review Queue</a>
      </div>
      <span class="backend-pill" title="Persistence backend">
        <span class="dot {{ 'online' if backend_online else '' }}" aria-hidden="true"></span>
        {{ backend_label }}
      </span>
    </nav>
  </header>
  <main id="main" class="container">
    {% if notice %}<div class="alert alert-success" role="status">{{ notice }}</div>{% endif %}
    {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
