[project]
name = "cfr-compliance-mcp"
version = "0.1.0"
description = "Production MCP server exposing the official eCFR API as structured tools for contract compliance checking."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Vvr" }
]

dependencies = [
    "fastmcp>=3.0,<4.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "pypdf>=6.14.2",
    "agno>=2.7.2",
    "openai>=2.45.0",
    "ollama>=0.6.2",
    "requests>=2.34.2",
    # REST API service (api.py) runtime requirements.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # OpenTelemetry tracing (api.py imports these unconditionally).
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-jaeger-thrift>=1.21",
    "psycopg[binary]>=3.3.4",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
cfr-compliance-mcp = "cfr_compliance_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfr_compliance_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
